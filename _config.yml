title: ezxmldsig documentation
description: >-
  Signed and encrypted XML tokens whose origin can be proven, in PHP and
  Node.js: why, how they work, and how to use them safely.
repository: https://github.com/webcoder31/ezxmldsig-doc
baseurl: /ezxmldsig-doc

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  # Rouge colours the code blocks when the site is built: no script in the
  # pages. Its classes take the colours of the demos (.highlight, site.css).
  syntax_highlighter: rouge

permalink: pretty

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - bin/
